name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
      - release**
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Check desktop identity resources
        run: python scripts/check_desktop_identity.py

      - name: Run shared JVM tests and build desktop app
        run: ./gradlew :shared:jvmTest :desktopApp:build :desktopApp:createDistributable --stacktrace

      - name: Package Windows MSI and EXE installers
        run: ./gradlew :desktopApp:packageMsi :desktopApp:packageExe --stacktrace

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: boitiertube-windows
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
