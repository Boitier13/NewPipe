name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
      - release**
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Download portable FFmpeg and VLC for Windows bundle
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-windows-bundle.ps1

      - name: Run shared JVM tests and build desktop app
        run: ./gradlew :shared:jvmTest :desktopApp:check :desktopApp:createDistributable --stacktrace

      - name: Verify bundled FFmpeg and VLC in distributable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $PWD "desktopApp/build/compose/binaries/main/app/NewPipe/app"
          $resDir = Join-Path $appDir "resources"
          $cfgPath = Join-Path $appDir "NewPipe.cfg"

          if (-not (Test-Path $cfgPath)) { throw "Missing NewPipe.cfg at $cfgPath" }
          $cfgText = Get-Content -Path $cfgPath -Raw
          if ($cfgText -notmatch 'compose\.application\.resources\.dir') {
              throw "NewPipe.cfg does not configure compose.application.resources.dir"
          }

          if (-not (Test-Path (Join-Path $resDir "ffmpeg/ffmpeg.exe"))) {
              throw "Missing bundled ffmpeg.exe in $resDir"
          }
          if (-not (Test-Path (Join-Path $resDir "vlc/libvlc.dll")) -or
              -not (Test-Path (Join-Path $resDir "vlc/libvlccore.dll")) -or
              -not (Test-Path (Join-Path $resDir "vlc/plugins"))) {
              throw "Missing bundled VLC DLLs/plugins in $resDir"
          }

          $env:NEWPIPE_VERIFY_BUNDLED_DIR = $resDir
          ./gradlew :shared:jvmTest --tests "net.newpipe.app.platform.WindowsBundledRuntimeSmokeTest" --rerun-tasks --stacktrace

      - name: Package Windows MSI installer
        run: ./gradlew :desktopApp:packageMsi --stacktrace

      - name: Verify Windows MSI installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI generated" }
          $sizeMb = [Math]::Round($msi.Length / 1MB, 1)
          Write-Host "Generated MSI: $($msi.Name) ($sizeMb MB)"
          if ($sizeMb -lt 80) {
              throw "MSI size ($sizeMb MB) is unexpectedly small; bundled FFmpeg/VLC may be missing"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
