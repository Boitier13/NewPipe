name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
      - release**
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - dev
      - master
      - arena/1461b4cf-newpipe
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Check desktop identity resources
        run: |
          python scripts/check_desktop_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_final_audit.py

      - name: Audit bundle path safeguards
        shell: pwsh
        run: |
          try {
            ./scripts/test-windows-bundle-paths.ps1
          } catch {
            $msg = ($_.ToString() -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            Write-Host "::error::$msg"
            exit 1
          }

      - name: Download portable FFmpeg and VLC for Windows bundle
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-windows-bundle.ps1

      - name: Run shared JVM tests
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP "gradle-shared-test.log"
          ./gradlew :shared:jvmTest 2>&1 | Tee-Object -FilePath $logFile
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errLines = @(Get-Content -Path $logFile | Select-String -Pattern '^e: |FAILURE:|What went wrong:|Execution failed|FAILED|^\s+at |Assertion|Exception' -Context 0,2 | ForEach-Object { $_.ToString() }) | Select-Object -First 60
            $xmlErrors = @(Get-ChildItem -Path "shared/build/test-results" -Recurse -Filter "*.xml" -ErrorAction SilentlyContinue | Select-String -Pattern '<failure|<error' -Context 0,3 | ForEach-Object { $_.ToString() }) | Select-Object -First 30
            $msg = ((($errLines + $xmlErrors) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if (-not $msg) {
              $msg = (((Get-Content -Path $logFile -Tail 60) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            }
            Write-Host "::error::$msg"
            exit $code
          }

      - name: Preserve complete JVM test results
        shell: pwsh
        run: Copy-Item shared/build/test-results/jvmTest shared/build/full-jvm-test-results -Recurse

      - name: Verify critical test suites actually ran
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{ DesktopBackupStoreTest = 19; DesktopRecoveryJournalTest = 4; PortableProfileTest = 6; DesktopDownloaderCookieTest = 4 }
          foreach ($name in $expected.Keys) {
            $path = "shared/build/full-jvm-test-results/TEST-net.newpipe.app.platform.$name.xml"
            [xml]$report = Get-Content $path -Raw
            $suite = $report.testsuite
            if ([int]$suite.tests -lt $expected[$name] -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) {
              throw "Missing or unsuccessful critical tests: $name"
            }
            Write-Host "::notice::$name tests=$($suite.tests) failures=$($suite.failures) errors=$($suite.errors) skipped=$($suite.skipped)"
          }

      - name: Run desktopApp checks
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP "gradle-desktop-check.log"
          ./gradlew :desktopApp:check 2>&1 | Tee-Object -FilePath $logFile
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $msg = (((Get-Content -Path $logFile -Tail 60) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            Write-Host "::error::$msg"
            exit $code
          }

      - name: Build desktop distributable
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP "gradle-distributable.log"
          ./gradlew :desktopApp:build :desktopApp:createDistributable 2>&1 | Tee-Object -FilePath $logFile
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $msg = (((Get-Content -Path $logFile -Tail 60) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            Write-Host "::error::$msg"
            exit $code
          }

      - name: Verify bundled FFmpeg and VLC in distributable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $PWD "desktopApp/build/compose/binaries/main/app/BoitierTube/app"
          $resDir = Join-Path $appDir "resources"
          $cfgPath = Join-Path $appDir "BoitierTube.cfg"

          if (-not (Test-Path $cfgPath)) { throw "Missing BoitierTube.cfg at $cfgPath" }
          $cfgText = Get-Content -Path $cfgPath -Raw
          if ($cfgText -notmatch 'compose\.application\.resources\.dir') {
              throw "BoitierTube.cfg does not configure compose.application.resources.dir"
          }

          if (-not (Test-Path (Join-Path $resDir "ffmpeg/ffmpeg.exe"))) {
              throw "Missing bundled ffmpeg.exe in $resDir"
          }
          if (-not (Test-Path (Join-Path $resDir "vlc/libvlc.dll")) -or
              -not (Test-Path (Join-Path $resDir "vlc/libvlccore.dll")) -or
              -not (Test-Path (Join-Path $resDir "vlc/plugins"))) {
              throw "Missing bundled VLC DLLs/plugins in $resDir"
          }

          $env:NEWPIPE_VERIFY_BUNDLED_DIR = $resDir
          $logFile = Join-Path $env:RUNNER_TEMP "gradle-smoke-test.log"
          $ErrorActionPreference = 'Continue'
          ./gradlew :shared:jvmTest --tests "net.newpipe.app.platform.WindowsBundledRuntimeSmokeTest" --rerun-tasks 2>&1 | Tee-Object -FilePath $logFile
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $msg = (((Get-Content -Path $logFile -Tail 60) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            Write-Host "::error::$msg"
            exit $code
          }

      - name: Verify isolated portable process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:BOITIERTUBE_PORTABLE_ROOT = Join-Path $env:RUNNER_TEMP ('portable-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $env:BOITIERTUBE_PORTABLE_ROOT | Out-Null
          ./gradlew :shared:jvmTest --tests "net.newpipe.app.platform.PortableModeSmokeTest" --rerun-tasks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BOITIERTUBE_PORTABLE_ROOT = $null

      - name: Package Windows MSI and EXE installers
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP "gradle-msi.log"
          ./gradlew :desktopApp:packageMsi :desktopApp:packageExe 2>&1 | Tee-Object -FilePath $logFile
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $msg = (((Get-Content -Path $logFile -Tail 60) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            Write-Host "::error::$msg"
            exit $code
          }

      - name: Verify Windows MSI installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI generated" }
          $sizeMb = [Math]::Round($msi.Length / 1MB, 1)
          Write-Host "Generated MSI: $($msi.Name) ($sizeMb MB)"
          if ($sizeMb -lt 80) {
              throw "MSI size ($sizeMb MB) is unexpectedly small; bundled FFmpeg/VLC may be missing"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: boitiertube-windows
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe

      - name: Archive runnable Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = "desktopApp/build/compose/binaries/main/app/BoitierTube"
          if (-not (Test-Path "$appDir/BoitierTube.exe")) { throw "Missing distribution launcher" }
          Copy-Item scripts/Start-BoitierTube-Portable.cmd "$appDir/Start-BoitierTube-Portable.cmd"
          Copy-Item doc/boitiertube-portable.md "$appDir/PORTABLE.md"
          Compress-Archive -Path $appDir -DestinationPath "desktopApp/build/BoitierTube-windows-x64.zip"
          Get-FileHash "desktopApp/build/BoitierTube-windows-x64.zip" -Algorithm SHA256 | Format-List

      - name: Upload runnable Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: boitiertube-windows-portable
          if-no-files-found: error
          path: desktopApp/build/BoitierTube-windows-x64.zip

      - name: Upload JVM and desktop test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boitiertube-test-reports
          if-no-files-found: warn
          path: |
            shared/build/test-results/**
            shared/build/full-jvm-test-results/**
            shared/build/reports/tests/**
            desktopApp/build/test-results/**
            desktopApp/build/reports/tests/**

  runtime-provenance:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate pinned runtime manifest
        shell: pwsh
        run: |
          $manifest = Get-Content .github/windows-runtimes.json -Raw | ConvertFrom-Json
          foreach ($name in @('ffmpeg', 'vlc')) {
            if ($manifest.$name.sha256 -notmatch '^[0-9a-f]{64}$') { throw "Invalid SHA256 for $name" }
            Write-Host "Pinned $name $($manifest.$name.version) $($manifest.$name.url)"
          }
